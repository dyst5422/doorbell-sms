[package]
name = "doorbell-sms"
version = "0.1.0"
authors = ["Dylan Stewart <jdylanstewart@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release.package.esp-hal]
opt-level = 3

[profile.dev.package.esp-hal]
opt-level = 3

[profile.dev]
opt-level = "z"
debug = true
lto = "fat"

[profile.release]
codegen-units = 1
debug = true
lto = "fat"
opt-level = "s"

[dependencies]
# ESP32-C3 HAL and runtime
esp-hal = { version = "~1.1.0", features = ["esp32c3", "log-04", "unstable", "exception-handler"] }
esp-radio = { version = "0.18", features = ["esp32c3", "wifi", "log-04", "unstable"] }
esp-rtos = { version = "0.3", features = ["esp32c3", "esp-radio", "embassy"] }
esp-alloc = "0.10"
esp-backtrace = { version = "0.19.0", features = ["esp32c3", "panic-handler", "println"] }
esp-println = { version = "0.17", features = ["esp32c3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32c3", "log-04"] }
esp-metadata-generated = { version = "0.4", features = ["esp32c3"] }

# TLS via mbedtls-rs
mbedtls-rs = { git = "https://github.com/esp-rs/mbedtls-rs.git", features = ["esp32c3", "tls", "embassy-time", "log", "hook-wall-clock"] }

# Embassy async runtime
embassy-executor = "0.10"
embassy-net = { version = "0.9", features = ["proto-ipv4", "medium-ethernet", "dhcpv4", "tcp", "dns"] }
embassy-time = "0.5"

# MQTT
rust-mqtt = { version = "0.5", default-features = false, features = ["v5", "bump"] }

# Embedded utilities
static_cell = "2"
heapless = "0.9"
log = "0.4"
rand_core = "0.10"
tinyrlibc = { version = "0.5", default-features = false, features = ["memchr"] }
